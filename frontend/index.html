<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 저장된 테마(또는 시스템 설정)를 React 렌더 전에 적용해, 다크 모드에서 밝은 화면이 잠깐 번쩍이는 걸 막는다.
      (function () {
        try {
          var stored = localStorage.getItem('glocalizer:theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          // 랜딩 스토리 목업이 앱 화면을 iframe으로 띄운다. 한국어 캡처·정적 목업이 항상 라이트라 iframe도 라이트로 고정해 톤을 맞춘다.
          if (window.self !== window.top) dark = false
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script>
      // 저장된 로그인 세션이 있으면 /auth/me 확인을 JS 번들 다운로드·실행과 겹쳐 미리 시작한다.
      // 이전에는 번들을 다 받고 React가 그려진 뒤에야 요청을 보내서, 그 시간만큼 "로그인 상태를 확인" 대기가 길어졌다.
      // 결과는 src/lib/authApi.ts의 fetchCurrentUser가 한 번만 꺼내 쓴다. (%VITE_API_BASE_URL%은 빌드 때 Vite가 채운다)
      (function () {
        try {
          var api = '%VITE_API_BASE_URL%'
          var token = localStorage.getItem('glocalizer:authToken')
          if (!token || !/^https?:/.test(api)) return
          // 서버가 응답하지 않아도 무한정 기다리지 않는다. 중단되면 fetchCurrentUser가 평소 경로(타임아웃 포함)로 다시 확인한다.
          var controller = new AbortController()
          var timer = setTimeout(function () { controller.abort() }, 15000)
          var response = fetch(api + '/auth/me', { headers: { Authorization: 'Bearer ' + token }, signal: controller.signal })
          response.then(function () { clearTimeout(timer) }, function () { clearTimeout(timer) })
          window.__earlyMe = { token: token, response: response }
        } catch (e) {}
      })()
    </script>
