services:
  - type: web
    name: glocalizer-api
    runtime: docker
    rootDir: backend
    region: singapore
    numInstances: 1
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PROJECT_TOKEN_SECRET
        generateValue: true
      # GET /downloads/count 조회 시 X-Admin-Key 헤더로 이 값을 보내야 한다.
      # 값은 Render 대시보드 → glocalizer-api → Environment에서 확인.
      - key: DOWNLOAD_STATS_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # OCR 주력 엔진. luna는 GPT-5.6 Luna(유료)를 쓰고, 실패/한글 미검출 시에만 PaddleOCR로
      # 자동 대체한다(ocr-provider.ts의 getOcrFallbackProvider). 벤치마크 근거는 2026-08-24 보고서 참고.
      - key: OCR_PROVIDER
        value: luna
      - key: OPENAI_API_KEY
        sync: false
      # Render Starter 플랜(512MB)에서 PaddleOCR의 메모리 급증을 제한한다.
      - key: AI_CONCURRENCY
        value: 1
      - key: CLEANUP_CONCURRENCY
        value: 1
      - key: OCR_IMAGE_MAX_DIMENSION
        value: 960
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
