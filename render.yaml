services:
  - type: web
    name: glocalizer-api
    runtime: docker
    rootDir: .
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: npm run db:migrate:production
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Supabase Dashboard → Connect → Session Pooler의 전체 URI를 넣습니다.
      - key: DATABASE_URL
        sync: false
      - key: PROJECT_TOKEN_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Render Starter 플랜(512MB)에서 PaddleOCR의 메모리 급증을 제한한다.
      - key: AI_CONCURRENCY
        value: 1
      - key: CLEANUP_CONCURRENCY
        value: 1
      - key: OCR_IMAGE_MAX_DIMENSION
        value: 960
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
